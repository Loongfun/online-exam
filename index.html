let cur = 0;
function isMulti(i){ return i>=10 && i<15; }
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  PAPERS.forEach((p,i)=>{
    const b = document.createElement('button');
    b.textContent = p.pname;
    if(i===cur) b.className='active';
    b.onclick = ()=>{cur=i; renderPaper(); renderTabs();};
    t.appendChild(b);
  });
}
function renderPaper(){
  const area = document.getElementById('paperArea');
  const p = PAPERS[cur];
  let html = '';
  const secs = [[0,10,'一、单选题（点击选项后立即判分并显示考点，每题5分）'],[10,15,'二、多选题（可勾选多个，勾选后点“确认本题”立即判分并显示考点，每题5分）'],[15,20,'三、判断题（点击选项后立即判分并显示考点，每题5分）']];
  secs.forEach(s=>{
    html += '<div class="sub-title">'+s[2]+'</div><div class="card">';
    for(let i=s[0]; i<s[1]; i++){
      const q = p.qs[i];
      const multi = isMulti(i);
      html += '<div class="q" id="q'+i+'"><div class="stem">'+(i+1)+'. '+q.t+'</div>';
      q.o.forEach((op,oi)=>{
        const type = multi? 'checkbox':'radio';
        html += '<label class="opt"><input type="'+type+'" name="p'+cur+'_q'+i+'" value="'+oi+'"'+(multi?'':' onchange="checkOne('+i+')"')+'>'+String.fromCharCode(65+oi)+'. '+op+'</label>';
      });
      if(multi){ html += '<button class="checkBtn" onclick="checkOne('+i+')">确认本题</button>'; }
      html += '<div class="explain" id="exp'+i+'"></div>';
      html += '<div class="kp" id="kp'+i+'" style="display:none;"></div></div>';
    }
    html += '</div>';
  });
  area.innerHTML = html;
  document.getElementById('result').textContent='';
  document.getElementById('weakTip').style.display='none';
}
function getSel(i){
  const boxes = document.querySelectorAll('input[name="p'+cur+'_q'+i+'"]:checked');
  return Array.from(boxes).map(b=>parseInt(b.value)).sort((a,b)=>a-b);
}
function isCorrect(i, selArr){
  const q = PAPERS[cur].qs[i];
  if(Array.isArray(q.a)) return selArr.length===q.a.length && q.a.slice().sort((a,b)=>a-b).every((x,idx)=>x===selArr[idx]);
  return selArr.length===1 && selArr[0]===q.a;
}
function checkOne(i){
  const q = PAPERS[cur].qs[i];
  const sel = getSel(i);
  const exp = document.getElementById('exp'+i);
  const kp = document.getElementById('kp'+i);
  const qDiv = document.getElementById('q'+i);
  if(sel.length===0){ exp.innerHTML='<span class="tag-wrong">⚠ 尚未作答</span>'; kp.style.display='none'; return; }
  if(isCorrect(i, sel)){ exp.innerHTML='<span class="tag-right">✔ 正确</span>'; qDiv.classList.add('done'); }
  else{ exp.innerHTML='<span class="tag-wrong">✘ 错误，正确答案：'+ansText(q.a)+'</span>'; }
  kp.style.display='block';
  kp.innerHTML = '<b>📖 本题考点：</b>' + q.k;
}
function gradeAll(){
  const p = PAPERS[cur];
  let score=0, wrongList=[];
  p.qs.forEach((q,i)=>{
    const sel = getSel(i);
    const exp = document.getElementById('exp'+i);
    const kp = document.getElementById('kp'+i);
    const qDiv = document.getElementById('q'+i);
    if(sel.length===0){ exp.innerHTML='<span class="tag-wrong">⚠ 未作答，正确答案：'+ansText(q.a)+'</span>'; wrongList.push({no:i+1,ans:ansText(q.a)}); }
    else if(isCorrect(i, sel)){ score+=5; exp.innerHTML='<span class="tag-right">✔ 正确</span>'; qDiv.classList.add('done'); }
    else { exp.innerHTML='<span class="tag-wrong">✘ 错误，正确答案：'+ansText(q.a)+'</span>'; wrongList.push({no:i+1,ans:ansText(q.a)}); }
    kp.style.display='block';
    kp.innerHTML = '<b>📖 本题考点：</b>' + q.k;
  });
  const r = document.getElementById('result');
  r.innerHTML = '<span class="'+(score>=60?'right':'wrong')+'">得分：'+score+' / 100　'+(score>=60?'通过 ✔':'未通过 ✘')+'</span>';
  const tip = document.getElementById('weakTip');
  tip.style.display='block';
  if(wrongList.length){
    let s = '<b>📌 本次错题（请把以下汇总反馈给助手做补强）：</b><br>';
    wrongList.forEach(w=>{ s+='第'+w.no+'题｜正确答案：'+w.ans+'<br>'; });
    tip.innerHTML = s;
  } else { tip.innerHTML = '🎉 全对！无弱点模块。'; }
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}
function ansText(a){
  if(Array.isArray(a)) return a.map(i=>String.fromCharCode(65+i)).join('');
  return String.fromCharCode(65+a);
}
function resetPaper(){ renderPaper(); }
renderTabs(); renderPaper();
</script>
